<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="agec-loader" viewBox="0 0 120 120" role="img" aria-label="載入中">
<title>國立臺灣大學農業經濟學系 — 載入中</title>
<style type="text/css">
/* ===== AGEC loading loop — 環形進度環繞 ==============================
   personality : 沉穩 · 生長 · 溫潤        canvas 120×120，建議顯示 64–160px
   ring  : 弧線旋轉 2000ms linear（spinner 是 linear 的唯一合理用法）
           ＋ dash 伸縮 1500ms ease-in-out；兩者週期互質，合成節奏不呆板
   mark  : 微呼吸 3400ms，振幅 1.8%（存在感，不表演）
   seam  : 每條動畫的 100% 關鍵格 === 0% 關鍵格，接縫零跳動
   note  : 所有選擇器都掛在 #agec-loader 底下，同一頁可安全放入多個版本
========================================================================== */
#agec-loader .st0{ fill:#F8B62D }
#agec-loader .st1{ fill:#00692F }
#agec-loader .track{ fill:none; stroke:#F8B62D; stroke-opacity:.22; stroke-width:3.6 }
#agec-loader .arc  { fill:none; stroke:#00692F; stroke-width:3.6; stroke-linecap:round;
              transform-origin:60px 60px;
              animation: agec-loader-spin 2000ms linear infinite,
                         agec-loader-dash 1500ms cubic-bezier(.42,0,.58,1) infinite; }
#agec-loader .breathe{ transform-box:fill-box; transform-origin:50% 50%;
              animation: agec-loader-breathe 3400ms cubic-bezier(.4,0,.6,1) infinite; }

@keyframes agec-loader-spin  { from { transform: rotate(0deg);   }
                        to   { transform: rotate(360deg); } }
/* dash 週期 = 1（pathLength 正規化）；100% 的 offset -1 等同 0，狀態與 0% 完全相同 */
@keyframes agec-loader-dash  { 0%   { stroke-dasharray:.04 .96; stroke-dashoffset:0;    }
                        45%  { stroke-dasharray:.72 .28; stroke-dashoffset:-.18; }
                        100% { stroke-dasharray:.04 .96; stroke-dashoffset:-1;   } }
@keyframes agec-loader-breathe{ 0%,100% { transform: scale(1);     }
                         50%     { transform: scale(1.018); } }

@media (prefers-reduced-motion: reduce){
  #agec-loader .arc, #agec-loader .breathe { animation: none !important; }
  #agec-loader .arc { stroke-dasharray:.26 .74; stroke-dashoffset:0; }
}
</style>

<!-- 外圈進度環 -->
<circle class="track" cx="60" cy="60" r="52"/>
<g transform="rotate(-90 60 60)">
  <circle class="arc" cx="60" cy="60" r="52" pathLength="1"/>
</g>

