<!-- 中文動效 lockup（以 agec_logo_motion.svg 為模板，移除英文小標）
     產生自 scripts/build-logos.py，請勿手改。 -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" id="agec-logo-motion" x="0px" y="0px" viewBox="0 0 255.1 113.4" role="img">
<title>國立臺灣大學農業經濟學系 AGEC — 標誌動效</title><defs><linearGradient id="agec-wipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" /><stop offset="0.045" stop-color="#fff" /><stop offset="1" stop-color="#fff" /></linearGradient><mask id="agec-mk-peak" maskUnits="userSpaceOnUse" x="44" y="-4" width="82" height="120"><rect class="w wp" x="44" y="101.6" width="82" height="110" fill="url(#agec-wipe)" /></mask><mask id="agec-mk-band-o" maskUnits="userSpaceOnUse" x="12" y="38" width="80" height="72"><g transform="rotate(47 25 101.4)"><rect class="w wbo" x="-32" y="106" width="110" height="130" fill="url(#agec-wipe)" /></g></mask><mask id="agec-mk-band-g" maskUnits="userSpaceOnUse" x="12" y="38" width="80" height="72"><g transform="rotate(47 25 101.4)"><rect class="w wbg" x="-32" y="106" width="110" height="130" fill="url(#agec-wipe)" /></g></mask></defs><style type="text/css">
	.st0{fill:#F8B62D;}
	.st1{fill:#00692F;}

/* ===== AGEC logo motion — 有機生長 organic-growth intro =========================
   personality : 沉穩 grounded · 生長 growing · 溫潤 warm
   pattern     : draw-on / directional growth wipe  (shape 10 : 62 : 28)
   total       : 2920ms, plays once, holds on the verified static logo
   tokens (documentation — literal values are used inside @keyframes on purpose,
   because var() timing-functions are silently dropped in Chromium keyframes)
     --p2m-duration      : 2920ms
     --p2m-ease-grow     : cubic-bezier(.45,.05,.2,1)   organic push-and-settle
     --p2m-ease-settle   : cubic-bezier(.16,1,.3,1)    universal ease-out
     --p2m-overshoot     : 1.0   (land exactly — institutional)
     --p2m-squash        : 0
============================================================================= */

/* --- 1. 山體自地面抽長 ------------------------------------------------ */
.wp        { animation: wipe-up 1150ms cubic-bezier(.45,.05,.2,1) 220ms both; }
.grow-peak { transform-box: fill-box; transform-origin: 50% 100%;
             animation: peak-settle 1500ms cubic-bezier(.45,.05,.2,1) 220ms both; }
@keyframes wipe-up     { from { transform: translateY(0);      }
                         to   { transform: translateY(-98px);  } }
@keyframes peak-settle { from { transform: scaleY(1.022); }
                         to   { transform: none;          } }

/* --- 2. 田帶沿路徑生長（橘先、綠後 150ms 拖曳層次）--------------------- */
.wbo { animation: wipe-diag 1050ms cubic-bezier(.42,.04,.22,1) 700ms both; }
.wbg { animation: wipe-diag 1050ms cubic-bezier(.42,.04,.22,1) 840ms both; }
#agec-band-o .grow-band { animation: band-drag 1300ms cubic-bezier(.16,1,.3,1) 700ms both; }
#agec-band-g .grow-band { animation: band-drag 1300ms cubic-bezier(.16,1,.3,1) 840ms both; }
@keyframes wipe-diag { from { transform: translateY(0);     }
                       to   { transform: translateY(-94px); } }
@keyframes band-drag { from { transform: translate(-2.1px, 1.95px); }
                       to   { transform: none;                      } }

/* --- 3. 字標分層浮現（AGEC 逐字 → 中文逐字 → 英文整塊）---------------- */
.rise      { opacity: 0; }
.ltr       { animation: rise-l 520ms cubic-bezier(.16,1,.3,1) calc(1450ms + var(--i) * 78ms) both; }
.cjk       { animation: rise-c 460ms cubic-bezier(.16,1,.3,1) calc(1760ms + var(--i) * 34ms) both; }
.en        { animation: rise-e 600ms cubic-bezier(.16,1,.3,1) 2320ms both; }
@keyframes rise-l { from { opacity:0; transform: translateY(4.5px); } to { opacity:1; transform: none; } }
@keyframes rise-c { from { opacity:0; transform: translateY(3.2px); } to { opacity:1; transform: none; } }
@keyframes rise-e { from { opacity:0; transform: translateY(2.2px); } to { opacity:1; transform: none; } }

/* --- 4. 無障礙：關閉動態時直接顯示定版標誌 ---------------------------- */
@media (prefers-reduced-motion: reduce) {
  .w, .grow-peak, .grow-band, .rise { animation: none !important; }
  .wp, .wbo, .wbg { transform: translateY(-120px); }
  .rise { opacity: 1; transform: none; }
}
</style>
